# Database

database:
  read_user:  'postgres_ro'
  write_user: 'postgres'
  db:         'mandyville'
  host:       'localhost'
  port:       5432
  pass:       'password'

# External APIs

football_data:
  api_token: 'changeme'

# FPL Draft leagues to keep in sync. C<id> is the draft league id and
# C<entry> is your own global entry id in that league (used to mark the
# C<is_mine> flag). Add one entry per league; replace the example values
# on each deployment.
fpl_draft:
  leagues:
    - id: 12345
      entry: 678

# Your own classic FPL entry id, tracked by update-fpl-classic.
fpl_classic:
  entry: 1234567

# Telegram bot for deadline reminders.
telegram:
  token: 'changeme'
  chat_id: 'changeme'

reminders:
  notifier: telegram
  timezone: 'Europe/London'
  poll_seconds: 300
  tick_seconds: 30
  offsets:                 # hours before the deadline
    classic: [24, 12, 2]
    draft:   [24, 12, 2]
    waivers: [24, 2]

healthcheck:
  update-competiton-data: 'changeme'
  update-fixture-data: 'changeme'
  update-fpl-info: 'changeme'
  update-understat-info: 'changeme'
  update-fpl-draft: 'changeme'
  update-fpl-availability: 'changeme'
  update-fpl-classic: 'changeme'
  fpl-deadline-reminders: 'changeme'
